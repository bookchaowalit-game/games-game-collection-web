# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
# CI never deploys (production is deployed with the Vercel CLI; see specs/001-shared-ci-sentry/spec.md).
name: Game Collection CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      node-version: "22"
      require-tests: true
      build-command: npm run build

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1

  # ADR-0007 design floor (public repo): builds the app, serves it with `next start` on the port in
  # design-floor.json, and runs the vendored checker (pinned by the reusable workflow's FLOOR_REF).
  design-floor:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/design-floor.yml@df695c12bdc6822587877d5fe55d3af31d5f66db # v1.5.11
    with:
      node-version: "22"
      build-command: npm run build
